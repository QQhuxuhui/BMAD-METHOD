# BMAD™ Module Installer - Hanyun APS Scheduling Agents

code: hanyunaps
name: "Hanyun APS Scheduling Agents"
default_selected: true

prompt: "Install Hanyun APS v4.2 Agent-as-Doc team (Todo + HITL)."

