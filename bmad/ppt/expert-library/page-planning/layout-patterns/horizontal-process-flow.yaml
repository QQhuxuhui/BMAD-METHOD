# Horizontal Process Flow Layout Pattern
# 横向流程图布局 - 适合展示业务流程、工作流程、操作步骤

name: Horizontal-Process-Flow
category: process
description: "横向流程图布局，从左到右展示流程节点，使用箭头连接，适合业务流程、技术流程、操作步骤等线性流程展示"

# 适用页面类型
compatible_page_types:
  - process-flow # 流程图
  - workflow # 工作流
  - user-journey # 用户旅程
  - timeline # 时间线
  - step-by-step # 步骤说明

# 布局特点
layout_characteristics:
  flow_direction: horizontal # 横向流动
  node_count: "3-6" # 支持3到6个节点
  arrow_style: solid # 实线箭头
  node_shape: rounded_rectangle # 圆角矩形节点
  alignment: center_vertical # 垂直居中对齐

# 布局区域定义
layout_zones:
  # 顶部：流程标题
  - zone: header
    element: title
    position: top_full_width
    size_percent: 12
    style:
      text_align: left
      font_size: 32
      font_weight: bold
      color: "#0066FF"
      margin_bottom: 20

  # 中部：流程节点容器
  - zone: flow_container
    element: process_nodes
    position: center
    size_percent: 65
    layout_mode: horizontal_flow

    # 流程节点模板
    node_template:
      count: "3-6"
      width_percent: "auto" # 根据节点数自动计算
      spacing_between: 40 # 节点间距（包含箭头空间）

      elements:
        # 节点主体
        - type: node_box
          style:
            background: "linear-gradient(135deg, #0066FF 0%, #3399FF 100%)" # 蓝色渐变
            text_color: "#FFFFFF"
            font_size: 18
            font_weight: 600
            padding_horizontal: 20
            padding_vertical: 15
            border_radius: 6
            min_height: 80
            text_align: center
            shadow: "0 3px 6px rgba(0, 102, 255, 0.2)"

        # 节点编号（可选）
        - type: node_number
          position: top_left
          optional: true
          style:
            background: "#FFB800" # 黄色编号
            text_color: "#FFFFFF"
            font_size: 14
            font_weight: bold
            width: 24
            height: 24
            border_radius: "50%"
            text_align: center

        # 节点说明（可选，在节点下方）
        - type: node_description
          position: below_node
          optional: true
          style:
            font_size: 14
            color: "#666666"
            text_align: center
            max_chars: 40
            margin_top: 10

    # 箭头连接器
    arrow_connector:
      width: 2.5 # 2-3pt
      color: "#0066FF" # 蓝色
      style: solid
      head_style: triangle
      head_size: 8

  # 底部：补充说明或截图（可选）
  - zone: supporting_content
    element: screenshots_or_notes
    position: bottom
    size_percent: 20
    optional: true
    layout_mode: horizontal_gallery

    content_options:
      - type: screenshot_gallery
        count: "2-4"
        screenshot_style:
          width: "auto"
          border: "1px solid #CCCCCC"
          border_radius: 4
          spacing: 15

      - type: footnote
        style:
          font_size: 12
          color: "#999999"
          text_align: left

# 公司标准主题适配
company_standard_styling:
  node_box:
    background: "linear-gradient(135deg, #0066FF 0%, #3399FF 100%)"
    text_color: "#FFFFFF"
    border_radius: 6
    shadow: "0 3px 6px rgba(0, 102, 255, 0.15)"

  node_number:
    background: "#FFB800" # 黄色编号圆圈
    text_color: "#FFFFFF"

  arrow:
    color: "#0066FF" # 蓝色箭头
    width: 2.5

  node_description:
    color: "#666666" # 中灰说明文字

# 内容约束
content_constraints:
  node_title:
    max_chars: 30
    recommended: "6-15字"

  node_description:
    max_chars: 40
    recommended: "10-20字"

  total_nodes:
    min: 3
    max: 6
    recommended: "4-5"

  flow_balance:
    node_width_variation: "≤15%" # 各节点宽度差异不超过15%

# 设计原则
design_principles:
  - "使用蓝色渐变圆角矩形作为流程节点"
  - "箭头2-3pt蓝色实线，方向从左到右"
  - "节点编号使用黄色圆圈突出"
  - "节点数量控制在3-6个，避免过度拥挤"
  - "可配合截图或示意图说明关键环节"
  - "节点宽度保持一致，保持视觉整齐"

# 使用场景
use_cases:
  - scenario: "补能调度业务流程"
    nodes:
      - number: 1
        title: "需求录入"
        description: "司机提交补能需求"
      - number: 2
        title: "智能匹配"
        description: "AI算法实时匹配站点"
      - number: 3
        title: "路径规划"
        description: "最优路线生成"
      - number: 4
        title: "执行监控"
        description: "实时跟踪补能状态"
      - number: 5
        title: "数据反馈"
        description: "效果分析与优化"

  - scenario: "用户注册流程"
    nodes:
      - title: "填写信息"
      - title: "验证手机"
      - title: "设置密码"
      - title: "完成注册"

  - scenario: "订单处理流程"
    nodes:
      - title: "订单创建"
      - title: "支付确认"
      - title: "拣货打包"
      - title: "物流配送"
      - title: "签收完成"

# 节点数量变体
node_count_variants:
  three_nodes:
    typical_use: "简化流程、核心步骤"
    width_percent_each: 28

  four_nodes:
    typical_use: "标准流程、平衡展示"
    width_percent_each: 22

  five_nodes:
    typical_use: "详细流程、完整链条"
    width_percent_each: 17

  six_nodes:
    typical_use: "复杂流程、全流程展示"
    width_percent_each: 14

# 与截图结合示例
with_screenshots:
  layout: "节点在上，截图在下"
  node_zone_percent: 50
  screenshot_zone_percent: 45
  alignment: "每个截图对应一个节点，垂直对齐"
