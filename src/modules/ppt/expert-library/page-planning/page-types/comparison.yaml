# Comparison Page Type
name: Comparison
type: comparison
description: "对比页,展示2-3个选项的对比"

default_content_slots:
  title:
    max_chars_en: 50
    max_chars_cn: 15
    hierarchy: H1
    content_hint: "对比主题"
  comparison_data:
    hierarchy: body
    content_hint: "对比项和数据"

default_special_requirements:
  has_chart: true
  chart_hint: "table or comparison matrix"

info_architecture_patterns:
  - "title + comparison_table"
  - "title + side_by_side_comparison"

compatible_layouts:
  - table-layout.yaml
  - two-column-text.yaml
