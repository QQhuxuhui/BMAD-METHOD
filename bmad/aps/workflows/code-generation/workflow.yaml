workflow_id: "aps-code-generation"
workflow_name: "Theory-to-Code代码生成工作流"
version: "4.3"
description: |
  从调度方案生成完整的可执行代码。

  使用场景：
  1. 在主workflow Phase 3中被自动调用
  2. 用户手动调用（bmad algorithm-expert → *generate-code）

  前置条件：
  - 必须先完成Phase 3（方案集成）
  - integrated_solution文件必须存在

metadata:
  author: "APS Team"
  created: "2025-10-29"
  bmad_version: "v6-alpha"
  expert: "algorithm-expert"
  estimated_time: "10-15分钟"

config:
  use_algorithm_library: true
  generate_tests: true
  target_language: "python"

steps:
  - step_id: "codegen-1"
    name: "加载完整方案"
    action: "exec"
    target: "bmad/aps/tasks/load-phase-state.md"

    critical: true

    pre_condition_check:
      required_files:
        - phase_id: "phase_3"
          on_missing: "block_with_error"
          error_message: |
            ❌ CRITICAL: Phase 3 方案文件缺失！

            代码生成需要基于完整的调度方案。

            解决方案：
            1. 返回主workflow：bmad aps → *start-scheduling
            2. 完成 Phase 0-3 后再生成代码

    inputs:
      - phase_id: "phase_3"
      - state_folder: "${config.state_management.state_folder}"
      - required: true
      - use_latest: true
      - format: "${config.state_management.state_format}"
    outputs:
      - state_data # 包含integrated_solution等
      - metadata
      - load_success
      - file_metadata

  - step_id: "codegen-2"
    name: "生成核心算法代码"
    action: "exec"
    target: "bmad/aps/tasks/generate-algorithm-code.md"
    inputs:
      - integrated_solution: "${state_data.integrated_solution}" # 从文件加载
    outputs:
      - algorithm_code

  - step_id: "codegen-3"
    name: "生成数据结构代码"
    action: "exec"
    target: "bmad/aps/tasks/generate-data-structures.md"
    inputs:
      - integrated_solution: "${state_data.integrated_solution}" # 从文件加载
    outputs:
      - data_structure_code

  - step_id: "codegen-4"
    name: "生成主流程代码"
    action: "exec"
    target: "bmad/aps/tasks/generate-main-flow.md"
    inputs:
      - algorithm_code
      - data_structure_code
    outputs:
      - main_code

  - step_id: "codegen-5"
    name: "生成测试代码"
    action: "exec"
    target: "bmad/aps/tasks/generate-test-code.md"
    inputs:
      - integrated_solution: "${state_data.integrated_solution}" # 从文件加载
    outputs:
      - test_code

outputs:
  primary:
    - algorithm_code
    - data_structure_code
    - main_code
    - test_code
