# Image-Left Layout Pattern
name: Image-Left
category: visual-focused
description: "图片在左,文字在右,50-50分割"

compatible_page_types:
  - image-focus
  - text-heavy

layout_zones:
  - zone: header
    element: title
    position: top_full_width
    size_percent: 15

  - zone: left
    element: image
    position: left
    size_percent: 45

  - zone: right
    element: text_or_bullets
    position: right
    size_percent: 45
