module_name: "Advanced Planning & Scheduling"
module_code: "aps"
version: "1.0.0-alpha"
description: "Expert agent team for scheduling optimization with Theory-to-Code workflow"

dependencies:
  core: "bmad-core@v6-alpha"
  modules: []

install_steps:
  - name: "Create APS module directory structure"
    action: "mkdir"
    paths:
      - "bmad/aps"
      - "bmad/aps/agents"
      - "bmad/aps/workflows"
      - "bmad/aps/workflows/scheduling-orchestration"
      - "bmad/aps/workflows/todo-management"
      - "bmad/aps/workflows/interaction-modes"
      - "bmad/aps/workflows/phase-1-requirements"
      - "bmad/aps/workflows/phase-1.5-modeling"
      - "bmad/aps/workflows/phase-2-coordination"
      - "bmad/aps/workflows/consistency-check"
      - "bmad/aps/workflows/phase-3-integration"
      - "bmad/aps/workflows/phase-4-quality"
      - "bmad/aps/templates"
      - "bmad/aps/templates/orchestrator-library"
      - "bmad/aps/templates/algorithm-library"
      - "bmad/aps/templates/constraint-library"
      - "bmad/aps/templates/objective-library"
      - "bmad/aps/templates/domain-library"
      - "bmad/aps/templates/extension-library"
      - "bmad/aps/templates/quality-library"
      - "bmad/aps/tasks"
      - "bmad/aps/data"
      - "bmad/aps/data/benchmarks"
      - "bmad/aps/data/examples"

  - name: "Copy APS agent files"
    action: "copy"
    mappings:
      - src: "bmad/aps/agents/orchestrator.md"
        dest: "bmad/aps/agents/orchestrator.md"
      - src: "bmad/aps/agents/algorithm-expert.md"
        dest: "bmad/aps/agents/algorithm-expert.md"
      - src: "bmad/aps/agents/constraint-expert.md"
        dest: "bmad/aps/agents/constraint-expert.md"
      - src: "bmad/aps/agents/objective-expert.md"
        dest: "bmad/aps/agents/objective-expert.md"
      - src: "bmad/aps/agents/domain-expert.md"
        dest: "bmad/aps/agents/domain-expert.md"
      - src: "bmad/aps/agents/extension-guide.md"
        dest: "bmad/aps/agents/extension-guide.md"
      - src: "bmad/aps/agents/quality-evaluator.md"
        dest: "bmad/aps/agents/quality-evaluator.md"

  - name: "Copy APS configuration and documentation"
    action: "copy"
    mappings:
      - src: "bmad/aps/config.yaml"
        dest: "bmad/aps/config.yaml"
      - src: "bmad/aps/README.md"
        dest: "bmad/aps/README.md"

  - name: "Initialize expert library templates"
    action: "mkdir"
    paths:
      - "bmad/aps/templates/orchestrator-library"
      - "bmad/aps/templates/algorithm-library"
      - "bmad/aps/templates/constraint-library"
      - "bmad/aps/templates/objective-library"
      - "bmad/aps/templates/domain-library"
      - "bmad/aps/templates/extension-library"
      - "bmad/aps/templates/quality-library"

  - name: "Register APS module"
    action: "register"
    module_metadata:
      code: "aps"
      name: "Advanced Planning & Scheduling"
      entry_agent: "bmad/aps/agents/orchestrator.md"
      primary_workflow: "bmad/aps/workflows/scheduling-orchestration/workflow.yaml"
      cli_command: "bmad aps"
      aliases:
        - "orchestrator"
        - "scheduling"

post_install:
  - name: "Display installation summary"
    action: "log"
    message: |
      ✅ APS Module installed successfully!

      📦 Module: Advanced Planning & Scheduling (v1.0.0-alpha)
      🎯 Entry Point: bmad aps

      📚 7 Expert Agents:
        - 🎯 系统编排协调智能体 (Orchestrator)
        - ⚙️ 调度算法专家 (Algorithm Expert)
        - 🔒 约束模式专家 (Constraint Expert)
        - 🎯 目标优化专家 (Objective Expert)
        - 🏢 领域应用专家 (Domain Expert)
        - 🔧 算法扩展指导 (Extension Guide)
        - 🛡️ 质量评测专家 (Quality Evaluator)

      🚀 Quick Start:
        bmad aps              # Activate orchestrator
        bmad orchestrator     # Same as above

      📖 Documentation: bmad/aps/README.md

      ⚠️ Next Steps:
        1. Populate expert libraries in bmad/aps/templates/
        2. Create workflow YAML files in bmad/aps/workflows/
        3. Add task definitions in bmad/aps/tasks/

validation:
  required_files:
    - "bmad/aps/config.yaml"
    - "bmad/aps/README.md"
    - "bmad/aps/agents/orchestrator.md"

  required_directories:
    - "bmad/aps/agents"
    - "bmad/aps/workflows"
    - "bmad/aps/templates"

  check_syntax: true
  validate_agents: true
