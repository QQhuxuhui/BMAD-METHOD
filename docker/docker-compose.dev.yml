version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bmad-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmad_langgraph_dev}
      POSTGRES_USER: ${POSTGRES_USER:-bmad_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bmad_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmad_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bmad-network

  redis:
    image: redis:7-alpine
    container_name: bmad-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bmad-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bmad-network:
    driver: bridge
