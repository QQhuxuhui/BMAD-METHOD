# Cover Standard Layout
# 标准封面布局

name: Cover Standard
layout_id: cover-standard
category: cover
description: "居中对齐的标准封面布局,适合大多数演示场景"

# 兼容页面类型
compatible_page_types:
  - cover

# 布局区域定义
layout_zones:
  - zone_id: background
    element: background_color_or_image
    position:
      x: 0
      y: 0
      width: 100% # 1920px for 16:9
      height: 100% # 1080px for 16:9
    z_index: 0

  - zone_id: title
    element: main_title
    position:
      x: center
      y: 40% # 从上往下40%处
      width: 80%
      height: auto
    alignment: center
    z_index: 2

  - zone_id: subtitle
    element: subtitle_or_tagline
    position:
      x: center
      y: 52%
      width: 70%
      height: auto
    alignment: center
    z_index: 2

  - zone_id: logo
    element: company_logo
    position:
      x: right-80px
      y: top-60px
      width: 120px
      height: auto
    alignment: top-right
    z_index: 3

  - zone_id: date_or_author
    element: presentation_date_or_author
    position:
      x: center
      y: bottom-100px
      width: auto
      height: auto
    alignment: center
    z_index: 2

# 尺寸规范
dimensions:
  slide_width: 1920 # px (16:9比例)
  slide_height: 1080 # px
  safe_area_margin: 60 # px (四周安全边距)

# 排版规范
typography_specs:
  title:
    font_size: 64 # pt (比其他页面的H1更大)
    font_weight: 700
    line_height: 1.2
    letter_spacing: -0.02em
    max_lines: 2

  subtitle:
    font_size: 24 # pt
    font_weight: 400
    line_height: 1.4
    max_lines: 2

  author:
    font_size: 16 # pt
    font_weight: 400

# 样式变体
variants:
  - variant_id: centered
    description: "完全居中,适合简洁风格"
    title_y: 40%
    subtitle_y: 52%

  - variant_id: lower_third
    description: "标题在下三分之一,适合全屏背景图"
    title_y: 65%
    subtitle_y: 75%

  - variant_id: left_aligned
    description: "左对齐,适合文字较多"
    title_x: left-100px
    title_alignment: left
    subtitle_x: left-100px
    subtitle_alignment: left

# 视觉效果
visual_effects:
  title:
    text_shadow: "0 2px 4px rgba(0, 0, 0, 0.3)" # 增强可读性
    可选_overlay: "rgba(0, 0, 0, 0.3)" # 暗色背景overlay,如果使用图片背景

  subtitle:
    opacity: 0.9

# 使用指南
usage_guidelines:
  do:
    - "标题控制在1-2行"
    - "如使用背景图,确保文字对比度"
    - "Logo保持适中大小,不喧宾夺主"

  dont:
    - "避免标题过长超过3行"
    - "避免logo过大抢占视觉焦点"
    - "避免副标题字数过多"

# 示例配置
example:
  title:
    text: "智能排程系统"
    font: "思源黑体 Bold"
    size: 64
    color: "#FFFFFF"
  subtitle:
    text: "让生产调度更智能 | 2025年融资路演"
    font: "思源黑体 Regular"
    size: 24
    color: "#CCCCCC"
  background:
    type: solid_color
    color: "#1A1A2E"
  logo:
    path: "assets/company-logo.png"
    width: 120
    position: top-right
