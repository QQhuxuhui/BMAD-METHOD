# Vertical Timeline Layout Pattern
# 垂直时间轴布局 - 适合展示项目里程碑、发展历程、roadmap

name: Vertical-Timeline
category: timeline
description: "垂直时间轴布局，自上而下展示时间节点和事件，适合项目里程碑、公司发展历程、产品roadmap等时间序列内容"

# 适用页面类型
compatible_page_types:
  - timeline # 时间线
  - roadmap # 路线图
  - milestones # 里程碑
  - history # 发展历程
  - project-phases # 项目阶段

# 布局特点
layout_characteristics:
  flow_direction: vertical # 垂直流动
  timeline_position: center_left # 时间轴位置（居中偏左）
  node_count: "3-6" # 支持3到6个时间节点
  alternating_layout: true # 左右交替布局
  visual_connection: timeline_line # 时间线连接

# 布局区域定义
layout_zones:
  # 顶部：标题
  - zone: header
    element: title
    position: top_full_width
    size_percent: 10
    style:
      text_align: left
      font_size: 32
      font_weight: bold
      color: "#0066FF"
      margin_bottom: 30

  # 中部：时间轴容器
  - zone: timeline_container
    element: timeline_nodes
    position: center
    size_percent: 85
    layout_mode: vertical_timeline

    # 时间轴线
    timeline_line:
      position: center_left_20_percent # 距左侧20%位置
      style:
        width: 3
        color: "#0066FF" # 蓝色时间轴线
        style: solid

    # 时间节点模板
    node_template:
      count: "3-6"
      vertical_spacing: 80 # 节点间距

      elements:
        # 时间点标记（圆点）
        - type: timeline_dot
          position: on_timeline_line
          style:
            size: 16
            background: "#0066FF" # 蓝色实心圆
            border: "3px solid #FFFFFF"
            shadow: "0 0 0 3px #CCE5FF" # 外圈淡蓝色光晕
            z_index: 10

        # 时间标签（日期/阶段）
        - type: time_label
          position: left_of_dot
          style:
            font_size: 16
            font_weight: 600
            color: "#0066FF"
            text_align: right
            width: 100
            margin_right: 30

        # 内容卡片（左右交替）
        - type: content_card
          position: alternating # 奇数节点右侧，偶数节点左侧
          width_percent: 65

          style:
            background: "#FFFFFF"
            border: "1px solid #E5E5E5"
            border_left: "4px solid #0066FF" # 左侧蓝色粗边框
            border_radius: 6
            padding: 20
            shadow: "0 2px 6px rgba(0, 0, 0, 0.08)"
            margin_left: 30 # 距时间轴30px

          content_structure:
            # 标题
            - type: event_title
              style:
                font_size: 20
                font_weight: bold
                color: "#333333"
                margin_bottom: 8

            # 描述
            - type: event_description
              style:
                font_size: 14
                color: "#666666"
                line_height: 1.6
                max_chars: 80

            # 标签（可选）
            - type: status_tag
              optional: true
              style:
                display: inline_block
                background: "#CCE5FF" # 浅蓝背景
                color: "#0066FF"
                font_size: 12
                padding: "4px 12px"
                border_radius: 12
                margin_top: 10

# 公司标准主题适配
company_standard_styling:
  timeline_line:
    color: "#0066FF" # 蓝色时间轴
    width: 3

  timeline_dot:
    background: "#0066FF" # 蓝色圆点
    border: "3px solid #FFFFFF"
    glow: "0 0 0 3px #CCE5FF" # 淡蓝光晕

  time_label:
    color: "#0066FF"
    font_weight: 600

  content_card:
    background: "#FFFFFF"
    border_left: "4px solid #0066FF" # 蓝色左边框强调
    border_radius: 6
    shadow: "0 2px 6px rgba(0, 0, 0, 0.08)"

  status_tag:
    completed:
      background: "#2A9D8F" # 绿色（已完成）
      color: "#FFFFFF"
    in_progress:
      background: "#FFB800" # 黄色（进行中）
      color: "#FFFFFF"
    planned:
      background: "#CCE5FF" # 浅蓝（计划中）
      color: "#0066FF"

# 内容约束
content_constraints:
  time_label:
    max_chars: 20
    format_examples:
      - "2024 Q1"
      - "第一阶段"
      - "2024年6月"
      - "里程碑1"

  event_title:
    max_chars: 40
    recommended: "8-20字"

  event_description:
    max_chars: 100
    recommended: "20-60字"

  total_nodes:
    min: 3
    max: 6
    recommended: "4-5"

# 设计原则
design_principles:
  - "时间轴使用蓝色实线，居中偏左放置"
  - "时间点用蓝色圆点标记，带白色边框和淡蓝光晕"
  - "内容卡片左侧蓝色粗边框强调"
  - "时间标签蓝色加粗，右对齐于时间轴"
  - "内容卡片可左右交替，增加视觉动感"
  - "使用状态标签区分完成/进行/计划状态"

# 使用场景
use_cases:
  - scenario: "产品开发里程碑"
    nodes:
      - time: "2024 Q1"
        title: "需求分析与架构设计"
        description: "完成市场调研，确定产品核心功能，设计系统架构"
        status: completed

      - time: "2024 Q2"
        title: "MVP开发与内测"
        description: "实现核心功能，邀请种子用户内测，收集反馈"
        status: completed

      - time: "2024 Q3"
        title: "产品优化与公测"
        description: "根据反馈优化体验，扩大测试范围，准备正式发布"
        status: in_progress

      - time: "2024 Q4"
        title: "正式发布与推广"
        description: "产品正式上线，市场推广，客户拓展"
        status: planned

  - scenario: "项目实施阶段"
    nodes:
      - { time: "阶段一", title: "需求调研", status: completed }
      - { time: "阶段二", title: "方案设计", status: completed }
      - { time: "阶段三", title: "系统开发", status: in_progress }
      - { time: "阶段四", title: "测试部署", status: planned }
      - { time: "阶段五", title: "上线运营", status: planned }

  - scenario: "公司发展历程"
    nodes:
      - time: "2020"
        title: "公司成立"
        description: "团队组建，确定业务方向"

      - time: "2021"
        title: "产品上线"
        description: "首个产品成功发布，获得首批客户"

      - time: "2022"
        title: "业务扩展"
        description: "客户数突破100家，团队扩充至50人"

      - time: "2023"
        title: "融资成功"
        description: "完成A轮融资，加速市场拓展"

      - time: "2024"
        title: "行业领先"
        description: "成为行业Top 3，服务客户500+"

# 布局变体
layout_variants:
  # 变体1：标准垂直时间轴（左右交替）
  alternating:
    timeline_position: center_left_20_percent
    card_alternating: true
    card_position: [right, left, right, left, ...]

  # 变体2：单侧垂直时间轴（全部右侧）
  single_side:
    timeline_position: left_15_percent
    card_alternating: false
    card_position: all_right

  # 变体3：简洁垂直时间轴（无卡片边框）
  minimal:
    timeline_position: center_left_20_percent
    card_border: none
    card_background: transparent
    emphasis: timeline_dot_and_line

# 状态标签配色
status_tag_colors:
  completed:
    text: "已完成"
    background: "#2A9D8F" # 绿色
    text_color: "#FFFFFF"

  in_progress:
    text: "进行中"
    background: "#FFB800" # 黄色
    text_color: "#FFFFFF"

  planned:
    text: "计划中"
    background: "#CCE5FF" # 浅蓝
    text_color: "#0066FF"

  delayed:
    text: "延期"
    background: "#E94560" # 红色
    text_color: "#FFFFFF"

# 时间格式建议
time_format_examples:
  quarter: ["2024 Q1", "2024 Q2", "2024 Q3", "2024 Q4"]
  month: ["2024年1月", "2024年6月", "2024年12月"]
  year: ["2020", "2021", "2022", "2023", "2024"]
  phase: ["第一阶段", "第二阶段", "第三阶段"]
  milestone: ["里程碑1", "里程碑2", "里程碑3"]
  week: ["Week 1", "Week 4", "Week 8", "Week 12"]
