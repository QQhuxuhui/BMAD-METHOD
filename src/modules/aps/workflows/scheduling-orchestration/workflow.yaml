workflow_id: "aps-scheduling-orchestration"
workflow_name: "APS调度求解完整流程"
version: "4.4.0"
description: "Phase 0-4完整调度优化流程，支持双模式交互、专家协作优化、Todo List追踪，Phase 3.5代码生成分离"

metadata:
  author: "APS Team"
  created: "2025-10-20"
  updated: "2025-11-04" # Phase 3.5分离更新
  bmad_version: "v6-alpha"
  estimated_time:
    mode_a: "82-117分钟" # 更新：增加Phase 3.5时间
    mode_b: "107-142分钟" # 更新：增加Phase 3.5时间

config:
  interaction_mode: "auto" # auto | mode_a | mode_b
  confidence_threshold: 0.70
  todo_tracking: true
  human_in_loop: true
  quality_gates_enabled: true

phases:
  - phase_id: "phase-0"
    phase_name: "Phase 0: 任务规划"
    estimated_time: "5-8分钟"
    description: "生成Todo List，用户确认形成执行合同"

    steps:
      - step_id: "0.1"
        name: "需求理解与初步分析"
        action: "exec"
        target: "bmad/aps/tasks/analyze-user-request.md"
        inputs:
          - user_request
        outputs:
          - initial_understanding
          - key_requirements
          - problem_domain

      - step_id: "0.2"
        name: "生成Todo List"
        action: "exec"
        target: "bmad/aps/tasks/generate-todo-list.md"
        inputs:
          - initial_understanding
          - key_requirements
        outputs:
          - todo_list
          - estimated_timeline

      - step_id: "0.3"
        name: "用户确认Todo List"
        action: "human_confirmation"
        trigger_level: "P0"
        confirmation_type: "todo_contract"
        template: "@交互对话模板库/Todo确认模板.md"
        inputs:
          - todo_list
          - estimated_timeline
        outputs:
          - confirmed_todo_list
          - user_adjustments

      - step_id: "0.4"
        name: "初始化TodoTracker"
        action: "exec"
        target: "bmad/aps/tasks/initialize-todo-tracker.md"
        inputs:
          - confirmed_todo_list
        outputs:
          - tracker_initialized
          - baseline_contract

      - step_id: "0.5"
        name: "💾 保存Phase 0状态"
        action: "exec"
        target: "bmad/aps/tasks/save-phase-state.md"
        description: "保存Todo List基线到文件系统，供后续Phase验证使用"

        mandatory_save: true
        critical: true

        inputs:
          - phase_id: "phase_0"
          - state_data:
              confirmed_todo_list: ${confirmed_todo_list}
              baseline_contract: ${baseline_contract}
              tracker_initialized: ${tracker_initialized}
              problem_domain: ${problem_domain} # V4.4.1修复：新增保存problem_domain，供Phase 2知识共享使用
              initial_understanding: ${initial_understanding} # V4.4.1修复：新增保存初步理解，供后续参考
          - state_folder: "${config.state_management.state_folder}"
          - format: "${config.state_management.state_format}"
          - include_metadata: true

        outputs:
          - saved_state_file
          - verification_result
          - file_metadata
          - manifest_updated

        post_action_verify:
          - check: "verification_result.all_checks_passed == true"
            on_fail: "block_and_retry"
            error_message: "Phase 0状态保存失败，无法继续workflow"
            max_retries: 3

  - phase_id: "phase-0.5"
    phase_name: "Phase 0.5: 双模式交互选择"
    estimated_time: "2-3分钟"
    description: "用户选择集中确认或增量确认模式"

    steps:
      - step_id: "0.5.1"
        name: "呈现模式对比"
        action: "exec"
        target: "bmad/aps/tasks/present-interaction-modes.md"
        outputs:
          - mode_comparison
          - recommendation

      - step_id: "0.5.2"
        name: "用户选择交互模式"
        action: "human_confirmation"
        trigger_level: "P0"
        confirmation_type: "mode_selection"
        template: "@交互对话模板库/模式选择模板.md"
        inputs:
          - mode_comparison
        outputs:
          - selected_mode

      - step_id: "0.5.3"
        name: "记录模式并初始化工作流"
        action: "exec"
        target: "bmad/aps/tasks/configure-workflow-mode.md"
        inputs:
          - selected_mode
        outputs:
          - workflow_configuration
          - phase_plan

      - step_id: "0.5.4"
        name: "💾 保存Phase 0.5状态"
        action: "exec"
        target: "bmad/aps/tasks/save-phase-state.md"
        description: "保存用户选择的交互模式和工作流配置"

        mandatory_save: true
        critical: true

        inputs:
          - phase_id: "phase_0_5"
          - state_data:
              selected_mode: ${selected_mode}
              workflow_configuration: ${workflow_configuration}
              phase_plan: ${phase_plan}
          - state_folder: "${config.state_management.state_folder}"
          - format: "${config.state_management.state_format}"
          - include_metadata: true

        outputs:
          - saved_state_file
          - verification_result
          - file_metadata
          - manifest_updated

        post_action_verify:
          - check: "verification_result.all_checks_passed == true"
            on_fail: "block_and_retry"
            error_message: "Phase 0.5状态保存失败"
            max_retries: 3

  - phase_id: "phase-1"
    phase_name: "Phase 1: 需求分析"
    estimated_time: "10-15分钟"
    description: "深入理解用户需求，检测偏离"

    steps:
      - step_id: "1.0"
        name: "🔍 加载Phase 0状态"
        action: "exec"
        target: "bmad/aps/tasks/load-phase-state.md"
        description: "加载Todo List基线，用于偏离检测"

        critical: true

        pre_condition_check:
          required_files:
            - phase_id: "phase_0"
              on_missing: "block_with_error"
              error_message: |
                ❌ CRITICAL: Phase 0 状态文件缺失！

                文件路径: {state_folder}/phase_0_state_latest.yaml

                可能原因:
                1. Phase 0 未完成
                2. 文件保存失败
                3. 文件被误删除

                解决方案:
                - 请从 Phase 0 重新开始执行工作流
                - 或检查 {state_folder} 目录权限

        inputs:
          - phase_id: "phase_0"
          - state_folder: "${config.state_management.state_folder}"
          - required: true
          - use_latest: true
          - format: "${config.state_management.state_format}"

        outputs:
          - state_data # 包含baseline_contract, confirmed_todo_list等
          - metadata
          - load_success
          - file_metadata

      - step_id: "1.1"
        name: "需求深度理解"
        action: "exec"
        target: "bmad/aps/tasks/analyze-requirements-deep.md"
        description: "基于Phase 0的初步分析，进行需求深度理解和澄清"
        inputs:
          - user_request
          - confirmed_todo_list: "${state_data.confirmed_todo_list}" # 从文件加载
        outputs:
          - requirement_analysis
          - clarification_questions

      - step_id: "1.2"
        name: "用户澄清（如需要）"
        action: "conditional_human_confirmation"
        condition: "confidence < 0.70 OR has_clarification_questions"
        trigger_level: "P1"
        template: "@交互对话模板库/需求澄清模板.md"
        inputs:
          - clarification_questions
        outputs:
          - clarified_requirements

      - step_id: "1.3"
        name: "TodoTracker偏离检测"
        action: "exec"
        target: "bmad/aps/tasks/check-todo-deviation.md"
        inputs:
          - current_analysis
          - baseline_contract: "${state_data.baseline_contract}" # 从文件加载
        outputs:
          - deviation_score
          - deviation_alert
        threshold: 0.60
        on_deviation: "trigger_replan"

      - step_id: "1.4"
        name: "💾 保存Phase 1状态"
        action: "exec"
        target: "bmad/aps/tasks/save-phase-state.md"
        description: "保存需求分析结果到文件系统"

        mandatory_save: true
        critical: true

        inputs:
          - phase_id: "phase_1"
          - state_data:
              requirement_analysis: ${requirement_analysis}
              clarified_requirements: ${clarified_requirements}
              deviation_score: ${deviation_score}
          - state_folder: "${config.state_management.state_folder}"
          - format: "${config.state_management.state_format}"
          - include_metadata: true

        outputs:
          - saved_state_file
          - verification_result
          - file_metadata
          - manifest_updated

        post_action_verify:
          - check: "verification_result.all_checks_passed == true"
            on_fail: "block_and_retry"
            error_message: "Phase 1状态保存失败"
            max_retries: 3

  - phase_id: "phase-1.5"
    phase_name: "Phase 1.5: 十要素建模"
    estimated_time:
      mode_a: "10-15分钟"
      mode_b: "5-8分钟"
    description: "构建TenElementModel统一真相源"

    steps:
      - step_id: "1.5.0"
        name: "🔍 加载Phase 1状态"
        action: "exec"
        target: "bmad/aps/tasks/load-phase-state.md"
        description: "加载需求分析结果，作为建模输入"

        critical: true

        pre_condition_check:
          required_files:
            - phase_id: "phase_1"
              on_missing: "block_with_error"
              error_message: |
                ❌ CRITICAL: Phase 1 状态文件缺失！

                文件路径: {state_folder}/phase_1_state_latest.yaml

                可能原因:
                1. Phase 1 未完成
                2. 文件保存失败

                解决方案:
                - 请从 Phase 1 重新开始执行

        inputs:
          - phase_id: "phase_1"
          - state_folder: "${config.state_management.state_folder}"
          - required: true
          - use_latest: true

        outputs:
          - state_data # 包含requirement_analysis, clarified_requirements
          - metadata
          - load_success

      - step_id: "1.5.1"
        name: "初步建模"
        action: "run-workflow"
        target: "bmad/aps/workflows/phase-1.5-modeling/workflow.yaml"
        inputs:
          - requirement_analysis: "${state_data.requirement_analysis}" # 从文件加载
        outputs:
          - ten_element_model_draft

      - step_id: "1.5.2"
        name: "用户确认TenElementModel"
        action: "conditional_human_confirmation"
        condition: "workflow_mode"
        trigger_level: "P0"
        mode_a:
          confirmation_type: "complete_model"
          template: "@交互对话模板库/完整十要素确认模板.md"
        mode_b:
          confirmation_type: "framework_only"
          template: "@交互对话模板库/框架十要素确认模板.md"
        inputs:
          - ten_element_model_draft
        outputs:
          - ten_element_model_confirmed

      - step_id: "1.5.3"
        name: "固化TenElementModel"
        action: "exec"
        target: "bmad/aps/tasks/finalize-ten-element-model.md"
        inputs:
          - ten_element_model_confirmed
        outputs:
          - ten_element_model
          - model_baseline

      - step_id: "1.5.4"
        name: "💾 保存Phase 1.5状态 (TenElementModel)"
        action: "exec"
        target: "bmad/aps/tasks/save-phase-state.md"
        description: "保存TenElementModel基线，这是所有后续Phase的核心依赖"

        mandatory_save: true
        critical: true

        inputs:
          - phase_id: "phase_1_5"
          - state_data:
              ten_element_model: ${ten_element_model}
              model_baseline: ${model_baseline}
              model_hash: ${model_baseline.hash}
          - state_folder: "${config.state_management.state_folder}"
          - format: "${config.state_management.state_format}"
          - include_metadata: true

        outputs:
          - saved_state_file
          - verification_result
          - file_metadata
          - manifest_updated

        post_action_verify:
          - check: "verification_result.all_checks_passed == true"
            on_fail: "block_and_retry"
            error_message: "TenElementModel保存失败，无法继续workflow"
            max_retries: 3

  - phase_id: "phase-2"
    phase_name: "Phase 2: 专家协调"
    estimated_time:
      mode_a: "10-15分钟"
      mode_b: "31-48分钟"
    description: "调用专家智能体分析并协调"

    steps:
      - step_id: "2.0"
        name: "🔍 加载Phase 1.5状态 (TenElementModel)"
        action: "exec"
        target: "bmad/aps/tasks/load-phase-state.md"
        description: "加载TenElementModel，作为所有专家分析的输入"

        critical: true

        pre_condition_check:
          required_files:
            - phase_id: "phase_1_5"
              on_missing: "block_with_error"
              error_message: |
                ❌ CRITICAL: Phase 1.5 TenElementModel 缺失！

                文件路径: {state_folder}/phase_1_5_state_latest.yaml

                TenElementModel是所有专家分析的核心依赖，必须存在。

                解决方案:
                - 请从 Phase 1.5 重新执行

        inputs:
          - phase_id: "phase_1_5"
          - state_folder: "${config.state_management.state_folder}"
          - required: true
          - use_latest: true

        outputs:
          - state_data # 包含ten_element_model, model_baseline
          - metadata
          - load_success

      # V4.4.1新增 - 修复P0问题：加载Phase 0状态以获取problem_domain
      - step_id: "2.0.1"
        name: "🔍 加载Phase 0状态 (问题域信息)"
        action: "exec"
        target: "bmad/aps/tasks/load-phase-state.md"
        description: "加载Phase 0的问题域信息，供知识共享使用"

        critical: false

        inputs:
          - phase_id: "phase_0"
          - state_folder: "${config.state_management.state_folder}"
          - required: false
          - use_latest: true

        outputs:
          - phase_0_state # 包含problem_domain, initial_understanding等
          - metadata
          - load_success

      # V4.4新增 - 方案依据: @改进方案/P2-agent-collaboration.md - 跨专家知识共享机制
      - step_id: "2.0.5"
        name: "🔗 专家知识预共享"
        action: "exec"
        target: "bmad/aps/tasks/share-expert-insights.md"
        description: "在各专家开始分析前，共享相关的领域知识，提升协作效果"

        inputs:
          - ten_element_model: "${state_data.ten_element_model}"
          - domain_type: "${phase_0_state.problem_domain}"

        outputs:
          - shared_context:
              domain_summary: {}
              critical_points: {}
              expert_guidance: {}
              collaboration_hints: []

      - step_id: "2.1"
        name: "专家协调（根据模式分支）"
        action: "conditional_flow"

        conditional_flow:
          mode_a:
            steps:
              # V4.4优化 - 方案依据: @改进方案/P2-agent-collaboration.md - 流水线协作模式
              # 改进：从完全并行改为流水线模式，提升专家协作一致性
              - step_id: "2.A.1"
                name: "领域专家分析（先行）"
                action: "exec"
                agent: "bmad/aps/agents/domain-expert.md"
                description: "领域专家先行，为其他专家提供领域洞察"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}"
                  - shared_context: "${shared_context}"
                outputs:
                  - domain_analysis

              - step_id: "2.A.2"
                name: "约束和目标专家并行分析"
                action: "parallel_exec"
                description: "基于领域洞察，约束和目标专家并行分析"
                agents:
                  - "bmad/aps/agents/constraint-expert.md"
                  - "bmad/aps/agents/objective-expert.md"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}"
                  - shared_context: "${shared_context}"
                  - domain_analysis: "${domain_analysis}"
                outputs:
                  - constraint_analysis
                  - objective_analysis

              - step_id: "2.A.3"
                name: "算法专家推荐（基于前面所有信息）"
                action: "exec"
                agent: "bmad/aps/agents/algorithm-expert.md"
                description: "基于领域、约束、目标的完整信息，推荐最优算法"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}"
                  - shared_context: "${shared_context}"
                  - domain_analysis: "${domain_analysis}"
                  - constraint_analysis: "${constraint_analysis}"
                  - objective_analysis: "${objective_analysis}"
                outputs:
                  - algorithm_recommendations

              # V4.4新增 - 方案依据: @改进方案/P2-agent-collaboration.md - 置信度评估机制
              - step_id: "2.A.4"
                name: "综合置信度评估"
                action: "exec"
                target: "bmad/aps/tasks/assess-overall-confidence.md"
                description: "评估所有专家的置信度，决定是否需要人机交互或互审"
                inputs:
                  - domain_analysis: "${domain_analysis}"
                  - constraint_analysis: "${constraint_analysis}"
                  - objective_analysis: "${objective_analysis}"
                  - algorithm_recommendations: "${algorithm_recommendations}"
                  - workflow_mode: "mode_a"
                outputs:
                  - confidence_assessment:
                      overall_score: 0.0
                      expert_scores: {}
                      weak_points: []
                      recommendation: {}

              # V4.4新增 - 方案依据: @改进方案/P2-agent-collaboration.md - 专家互审机制
              - step_id: "2.A.5"
                name: "专家交叉审核（条件触发）"
                action: "conditional_exec"
                condition: "confidence_assessment.overall_score < 0.75"
                target: "bmad/aps/tasks/expert-peer-review.md"
                description: "置信度较低时，触发专家交叉审核提升质量"
                inputs:
                  - domain_analysis: "${domain_analysis}"
                  - constraint_analysis: "${constraint_analysis}"
                  - objective_analysis: "${objective_analysis}"
                  - algorithm_recommendations: "${algorithm_recommendations}"
                  - confidence_assessment: "${confidence_assessment}"
                outputs:
                  - peer_review_report: {}

              - step_id: "2.A.6"
                name: "跨专家一致性校验"
                action: "exec"
                target: "bmad/aps/tasks/check-cross-expert-consistency.md"
                description: "检查各专家分析结果的一致性，识别潜在冲突"
                inputs:
                  - domain_analysis
                  - constraint_analysis
                  - objective_analysis
                  - algorithm_recommendations
                outputs:
                  - consistency_report
                  - conflicts

              - step_id: "2.A.7"
                name: "冲突仲裁（如需要）"
                action: "conditional_human_confirmation"
                condition: "has_conflicts"
                trigger_level: "P2"
                template: "@交互对话模板库/冲突仲裁模板.md"
                inputs:
                  - conflicts
                outputs:
                  - conflict_resolutions

          mode_b:
            steps:
              - step_id: "2.B.1"
                name: "Phase 2.1: 领域专家增量确认"
                action: "sequential_exec"
                agent: "bmad/aps/agents/domain-expert.md"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}" # 从文件加载
                  - shared_context: "${shared_context}" # V4.4.1修复：添加知识共享上下文
                outputs:
                  - domain_analysis
                confirmation:
                  trigger_level: "P0"
                  template: "@交互对话模板库/领域确认模板.md"

              - step_id: "2.B.2"
                name: "Phase 2.2: 约束专家增量确认"
                action: "sequential_exec"
                agent: "bmad/aps/agents/constraint-expert.md"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}" # 从文件加载
                  - shared_context: "${shared_context}" # V4.4.1修复：添加知识共享上下文
                  - domain_analysis
                outputs:
                  - constraint_analysis
                confirmation:
                  trigger_level: "P0"
                  template: "@交互对话模板库/约束确认模板.md"

              - step_id: "2.B.3"
                name: "Phase 2.3: 目标专家增量确认"
                action: "sequential_exec"
                agent: "bmad/aps/agents/objective-expert.md"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}" # 从文件加载
                  - shared_context: "${shared_context}" # V4.4.1修复：添加知识共享上下文
                  - domain_analysis
                  - constraint_analysis
                outputs:
                  - objective_analysis
                confirmation:
                  trigger_level: "P0"
                  template: "@交互对话模板库/目标权重模板.md"

              - step_id: "2.B.4"
                name: "Phase 2.4: 算法专家增量确认"
                action: "sequential_exec"
                agent: "bmad/aps/agents/algorithm-expert.md"
                inputs:
                  - ten_element_model: "${state_data.ten_element_model}" # 从文件加载
                  - shared_context: "${shared_context}" # V4.4.1修复：添加知识共享上下文
                  - domain_analysis
                  - constraint_analysis
                  - objective_analysis
                outputs:
                  - algorithm_recommendations
                confirmation:
                  trigger_level: "P0"
                  template: "@交互对话模板库/算法确认模板.md"

              - step_id: "2.B.5"
                name: "Phase 2.5: 跨专家一致性校验"
                action: "exec"
                target: "bmad/aps/tasks/check-cross-expert-consistency.md"
                description: "检查各专家分析结果的一致性，识别潜在冲突"
                inputs:
                  - domain_analysis
                  - constraint_analysis
                  - objective_analysis
                  - algorithm_recommendations
                outputs:
                  - consistency_report
                  - conflicts

              # V4.4.1新增 - 修复P1问题：为Mode B添加置信度评估机制
              - step_id: "2.B.6"
                name: "综合置信度评估"
                action: "exec"
                target: "bmad/aps/tasks/assess-overall-confidence.md"
                description: "评估所有专家的置信度，决定是否需要互审"
                inputs:
                  - domain_analysis: "${domain_analysis}"
                  - constraint_analysis: "${constraint_analysis}"
                  - objective_analysis: "${objective_analysis}"
                  - algorithm_recommendations: "${algorithm_recommendations}"
                  - workflow_mode: "mode_b"
                outputs:
                  - confidence_assessment:
                      overall_score: 0.0
                      expert_scores: {}
                      weak_points: []
                      recommendation: {}

              # V4.4.1新增 - 修复P1问题：为Mode B添加专家互审机制
              - step_id: "2.B.7"
                name: "专家交叉审核（条件触发）"
                action: "conditional_exec"
                condition: "confidence_assessment.overall_score < 0.75"
                target: "bmad/aps/tasks/expert-peer-review.md"
                description: "置信度较低时，触发专家交叉审核提升质量"
                inputs:
                  - domain_analysis: "${domain_analysis}"
                  - constraint_analysis: "${constraint_analysis}"
                  - objective_analysis: "${objective_analysis}"
                  - algorithm_recommendations: "${algorithm_recommendations}"
                  - confidence_assessment: "${confidence_assessment}"
                outputs:
                  - peer_review_report: {}

      - step_id: "2.9"
        name: "💾 保存Phase 2状态 (专家分析结果)"
        action: "exec"
        target: "bmad/aps/tasks/save-phase-state.md"
        description: "保存所有专家的分析结果和一致性报告"

        mandatory_save: true
        critical: true

        inputs:
          - phase_id: "phase_2"
          - state_data:
              domain_analysis: ${domain_analysis}
              constraint_analysis: ${constraint_analysis}
              objective_analysis: ${objective_analysis}
              algorithm_recommendations: ${algorithm_recommendations}
              consistency_report: ${consistency_report}
          - state_folder: "${config.state_management.state_folder}"
          - format: "${config.state_management.state_format}"
          - include_metadata: true

        outputs:
          - saved_state_file
          - verification_result
          - file_metadata
          - manifest_updated

        post_action_verify:
          - check: "verification_result.all_checks_passed == true"
            on_fail: "block_and_retry"
            error_message: "Phase 2专家分析结果保存失败"
            max_retries: 3

  - phase_id: "phase-3"
    phase_name: "Phase 3: 方案集成"
    estimated_time: "15-20分钟"
    description: "专注于技术方案设计、文档生成和用户确认，确保高质量的技术方案交付"

    steps:
      - step_id: "3.0"
        name: "🚀 调用Phase 3方案集成工作流"
        action: "run-workflow"
        target: "bmad/aps/workflows/phase-3-solution-integration/workflow.yaml"
        description: "调用专门的Phase 3工作流，负责方案集成和文档生成"

        critical: true

        pre_condition_check:
          required_phases:
            - phase_id: "phase_2"
              on_missing: "block_with_error"
              error_message: |
                ❌ CRITICAL: Phase 2 专家协调未完成！

                Phase 3方案集成需要Phase 2的专家分析结果作为输入。

                解决方案: 请从 Phase 2 重新执行

        inputs:
          # Phase 3工作流会自动加载这些状态
          - phase_1_5_state_source: "phase_1_5"
          - phase_2_state_source: "phase_2"

        outputs:
          - integrated_solution # 完整的集成方案
          - user_approved_solution # 用户确认的方案
          - solution_document_path # 方案文档路径
          - solution_data_path # 方案数据路径
          - phase_3_completion # Phase 3完成状态

        post_action_verify:
          - check: "phase_3_completion.success == true"
            on_fail: "block_and_retry"
            error_message: "Phase 3方案集成失败"
            max_retries: 2

        # 传递关键数据给Phase 3.5
        success_actions:
          - log: "✅ Phase 3 方案集成完成"
          - log: "📄 方案文档: ${solution_document_path}"
          - log: "👤 用户确认方案: ${user_approved_solution.approval_timestamp}"
          - log: "🚀 准备进入 Phase 3.5 代码生成"

  - phase_id: "phase-3.5"
    phase_name: "Phase 3.5: 代码生成"
    estimated_time: "20-25分钟"
    description: "由代码实现专家主导，基于用户确认的技术方案生成高质量可执行代码"

    steps:
      - step_id: "3.5.0"
        name: "🚀 调用Phase 3.5代码生成工作流"
        action: "run-workflow"
        target: "bmad/aps/workflows/phase-3.5-code-generation/workflow.yaml"
        description: "调用专门的Phase 3.5工作流，负责代码生成和质量保证"

        critical: true

        pre_condition_check:
          required_phases:
            - phase_id: "phase_3"
              on_missing: "block_with_error"
              error_message: |
                ❌ CRITICAL: Phase 3 方案集成未完成！

                Phase 3.5代码生成需要Phase 3的用户确认方案作为输入。

                解决方案: 请从 Phase 3 重新执行

        inputs:
          # Phase 3.5工作流会自动加载这些状态
          - phase_3_state_source: "phase_3"
          - phase_1_5_state_source: "phase_1_5"

        outputs:
          - implementation_code # 完整的代码包
          - code_traceability # 代码可追溯性
          - deliverable_manifest # 交付物清单
          - phase_3_5_completion # Phase 3.5完成状态

        post_action_verify:
          - check: "phase_3_5_completion.success == true"
            on_fail: "block_and_retry"
            error_message: "Phase 3.5代码生成失败"
            max_retries: 2

        # 传递关键数据给Phase 4
        success_actions:
          - log: "✅ Phase 3.5 代码生成完成"
          - log: "💻 代码包: ${implementation_code.package_path}"
          - log: "📚 代码文档: ${implementation_code.documentation_path}"
          - log: "�� 质量评分: ${quality_score}"
          - log: "🚀 准备进入 Phase 4 质量保证"

  - phase_id: "phase-4"
    phase_name: "Phase 4: 质量保证"
    estimated_time: "9-12分钟"
    description: "质量门禁验证，确保可交付"

    steps:
      - step_id: "4.0.1"
        name: "🔍 加载Phase 3.5状态 (代码生成)"
        action: "exec"
        target: "bmad/aps/tasks/load-phase-state.md"
        description: "加载集成方案和实现代码"
